# Creates an empty shared prefix and nothing else. pw_install still installs
# DXVK because graphics is dxvk.
name: "bare blur5"
game_slug: bare-blur5
runner: wine
prospero:
  name: bare
  prefix: blur5
  graphics: dxvk
script:
  game:
    exe: drive_c/windows/system32/notepad.exe
    prefix: $GAMEDIR
  wine:
    overrides: {}
  installer:
  - task: {name: create_prefix, prefix: $GAMEDIR, arch: win32}
